services:
  # FastAPI Python ML Backend Web Service (100% Free Plan)
  - type: web
    name: vyuha-ml-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./vyuha.db

  # React Vite Frontend Static Site (100% Free)
  - type: web
    name: vyuha-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
